name: Windows test build
on:
  push:
    branches: [windisplay-test-build]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build -- --config src-tauri/tauri.test.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: WinDisplay-test-x64
          path: src-tauri/target/release/WinDisplay.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: WinDisplay-test-installer-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
